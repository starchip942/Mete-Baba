    if (rt.geo) { rt.scene = buildTraceScene(); pt.setScene(rt.scene, camera); rt.geo = rt.env = rt.cam = false; }

    if (pt.target?.texture && renderer.extensions.has('OES_texture_float_linear')) pt.target.texture.magFilter = THREE.LinearFilter;
    rt.phase = 'trace';
  } catch (e) { traceFail(); }
}

/* ═══════════════════════════ UI ═══════════════════════════ */
const ui = { paused: reduceMotion, busy: false, lastInput: -1e9, spin: 0, flashUntil: 0, flashMsg: '' };
const flash = msg => { ui.flashMsg = msg; ui.flashUntil = performance.now() + 4200; };
const fmt = new Intl.NumberFormat('en-US');
$('sPetals').value = petalCount; $('oPetals').textContent = fmt.format(petalCount);
$('bPause').setAttribute('aria-pressed', String(ui.paused));
$('bPause').addEventListener('click', () => { ui.paused = !ui.paused; $('bPause').setAttribute('aria-pressed', String(ui.paused)); ui.lastInput = -1e9; });
$('bRT').addEventListener('click', () => toggleTrace(!rt.on));
$('sTime').addEventListener('input', e => { applyTime(+e.target.value); $('oTime').textContent = TOD.name; rt.env = true; if (rt.phase !== 'raster') { rt.phase = 'raster'; setTraceView(false); } rt.still = 0; rt.k = 0; });
$('sPetals').addEventListener('input', e => { petalCount = +e.target.value; $('oPetals').textContent = fmt.format(petalCount); updatePetals(U.time.value); rt.geo = true; if (rt.phase !== 'raster') { rt.phase = 'raster'; setTraceView(false); } rt.still = 0; rt.k = 0; });
controls.addEventListener('start', () => { ui.busy = true; document.body.classList.add('touched'); });
controls.addEventListener('end', () => { ui.busy = false; ui.lastInput = performance.now(); });
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); $('bPause').click(); }
  else if (e.key === 'r' || e.key === 'R') $('bRT').click();
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('quiet');
});
addEventListener('resize', resize);

/* ═══════════════════════════ main loop ═══════════════════════════ */
const clock = new THREE.Clock(), _v = new THREE.Vector3(), _f = new THREE.Vector3();
let simT = 0, frames = 0, perfAcc = 0, perfN = 0, perfGood = 0, intro = 0;
function simulate(t, dt) {
  U.time.value = t;
  for (const I of ISLES) I.group.position.y = I.def.pos[1] + Math.sin(t * .45 + I.def.ph) * I.def.bob;
  updateBridges(t); updatePetals(t); updateFalls(t); updateCritters(t); updateClouds(t, dt);
}
function frame() {
  const now = performance.now(), raw = clock.getDelta(), dt = Math.min(raw, .1);
  frames++;
  refreshEnv(now);
  if (!rt.on) {                                                             // the world holds its breath while it is being ray traced
    const idle = !ui.busy && now - ui.lastInput > 3200;
    ui.spin += ((ui.paused || !idle ? 0 : 1) - ui.spin) * (1 - Math.exp(-dt * 2.2));
    world.rotation.y += dt * TAU / 60 * ui.spin;
    simT += dt; simulate(simT, dt);
  }
  if (intro < 1 && !document.body.classList.contains('touched')) {          // slow push-in on arrival
    intro = Math.min(1, intro + dt / 4.5); const e = 1 - Math.pow(1 - intro, 3);
    camera.position.copy(HOME).sub(TARGET).multiplyScalar((1.3 - .3 * e) * Math.max(1, 1.2 / camera.aspect)).add(TARGET);
  }
  controls.update();
  camera.updateMatrixWorld();

  // sun on screen → god rays;  focus on the orbit target → depth of field
  _v.fromArray(SKY.lightDir).multiplyScalar(1000).add(camera.position).project(camera);
  camera.getWorldDirection(_f);
  const facing = _f.x * SKY.lightDir[0] + _f.y * SKY.lightDir[1] + _f.z * SKY.lightDir[2];
  raysPass.uniforms.uSun.value.set(_v.x * .5 + .5, _v.y * .5 + .5);
  raysPass.uniforms.uIntensity.value = TOD.ray * .3 * smooth(.05, .5, facing);
  raysPass.uniforms.uColor.value.fromArray(mix3(SKY.lightCol, SKY.glow, .45));
  dofPass.uniforms.uFocus.value = camera.position.distanceTo(controls.target);
  mistMat.uniforms.uSunView.value.fromArray(SKY.lightDir).transformDirection(camera.matrixWorldInverse);
  grade.uniforms.uWarm.value = 1 - .6 * smooth(.82, 1, TOD.k);
  bloom.strength = .26 + TOD.lan * .14;

  let status = 'Real-time';
  if (rt.on) {
    const e = camera.matrixWorld.elements; let moved = false;
    for (let i = 0; i < 16; i++) { if (Math.abs(e[i] - rt.last[i]) > 1e-5) moved = true; rt.last[i] = e[i]; }
    if (moved) { rt.cam = true; rt.still = 0; rt.k = 0; if (rt.phase === 'trace') { rt.phase = 'raster'; setTraceView(false); } }
    else rt.still += dt;
    status = rt.loading ? 'Loading path tracer…' : 'Ray tracing · waiting for the camera to settle';
    if (rt.pt && rt.phase === 'raster' && rt.still > .35 && frames > 3) { rt.phase = 'prepare'; setTimeout(tracePrepare, 60); }
    if (rt.phase === 'prepare') status = '<b>Ray tracing</b> · building the scene…';
    if (rt.phase === 'trace') {
      try {
        if (rt.cam) { rt.pt.updateCamera(); rt.cam = false; rt.k = 0; }
        const done = rt.pt.samples >= RT_MAX;
        if (!done) rt.pt.renderSample();
        if (rt.pt.samples >= 1) rt.k = Math.min(1, rt.k + dt / .6);
        tracePass.u.b.value = rt.pt.target.texture; tracePass.u.k.value = rt.k * rt.k * (3 - 2 * rt.k);
        setTraceView(true);
        status = `<b>Ray tracing</b> · ${Math.floor(rt.pt.samples)} samples${done ? ' · converged' : ''}`;
      } catch (err) { traceFail(); }
    }
  }
  if (now < ui.flashUntil) status = ui.flashMsg;
  if ($('status').innerHTML !== status) $('status').innerHTML = status;

  composer.render(dt);

  if (frames === 3) { document.body.classList.remove('booting'); $('veil').classList.add('done'); setTimeout(() => $('veil').remove(), 1800); }
  // adaptive resolution: hold 60 fps by trading pixels, never above a pixel ratio of 2
  if (!rt.on && frames > 30 && raw < .3 && !document.hidden) {
    perfAcc += raw; perfN++;
    if (perfN >= 50) {
      const avg = perfAcc / perfN, cap = Math.min(window.devicePixelRatio || 1, 2); perfAcc = perfN = 0;
      if (avg > .0235 && DPR > .7) { DPR = Math.max(.7, DPR - .25); perfGood = 0; resize(); }
      else if (avg < .0135 && DPR < cap && ++perfGood >= 5) { DPR = Math.min(cap, DPR + .25); perfGood = 0; resize(); }
    }
  }
}

applyTime(+$('sTime').value); $('oTime').textContent = TOD.name;
resize(); simulate(0, 0);
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
